# ShramSetu — fully containerised production deployment.
#
# Build & run from the repo root:
#   docker compose up -d
#
# Services (all with healthchecks; the router only answers once all four are
# healthy):
#   - mongo      :27017   (MongoDB, data persisted in a named volume)
#   - ai-service :8100    (FastAPI: RAG + Groq/Gemini, local faster-whisper STT,
#                          local MMS text-to-speech)
#   - server     :8000    (Express + Mongoose: auth, grievances, documents,
#                          chat, notifications; proxies /api to ai-service)
#   - frontend   :80      (nginx: SPA + proxies /api to server)
#
# Public origin: configure Certs and domain in nginx conf, then expose 80/443.
# Env vars with bare names (GROQ_API_KEY, JWT_SECRET_KEY, etc.) are injected
# from the host environment — see README "Deployment" for the full list.

services:
  mongo:
    image: mongo:8
    container_name: shramsetu-mongo
    restart: unless-stopped
    # Root credentials must match the server's MONGODB_URI below
    # (mongodb://root:shramsetu123@mongo:27017/...authSource=admin).
    # Only applied on first boot when the mongo_data volume is empty.
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=shramsetu123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: shramsetu-ai-service
    restart: unless-stopped
    ports:
      - "8100:8100"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ai_index:/app/rag/index
      - ai_models:/app/models
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8100/health/ready | grep -q '\"ready\":true'"]
      interval: 20s
      timeout: 10s
      retries: 30
      # First boot downloads whisper + IndicTrans2 + embedding models (multi-GB)
      # before /health/ready flips to true.
      start_period: 600s
    environment:
      - ENV=production
      - DEBUG=false
      - GROQ_API_KEY
      - GEMINI_API_KEY
      - GROQ_MODEL
      - AI_INTERNAL_KEY
      # Persist HF/whisper/IndicTrans2 downloads in the ai_models volume so a
      # container restart does not re-download multi-GB models.
      - HF_HOME=/app/models/huggingface
      - GOOGLE_API_KEY
      - WHISPER_MODEL_SIZE=large-v3-turbo
      # Per-language fine-tuned Whisper checkpoints (WHISPER_INDIC_MODELS in
      # config.py) lazy-load on first use of each language — no override here.
      - HF_TOKEN
    deploy:
      resources:
        limits:
          memory: 16g

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shramsetu-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - ENV=production
      - DEBUG=false
      - MONGODB_URI=mongodb://root:shramsetu123@mongo:27017/shramsetu?authSource=admin
      - JWT_SECRET_KEY
      - AI_SERVICE_URL=http://ai-service:8100
      - AI_INTERNAL_KEY
      - BOOTSTRAP_ADMIN_PASSWORD
      # assertProductionSafe() refuses to boot with OTP echo on (default is on!).
      - OTP_ECHO_ENABLED=false
      - SEED_DEMO_DATA=false
      - DOC_MASTER_KEY
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173}
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shramsetu-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=/api
    volumes:
      - frontend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  ai_index:
  ai_models:
  frontend_uploads:
