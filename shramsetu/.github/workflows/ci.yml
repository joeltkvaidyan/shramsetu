name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: |
          pip install fastapi uvicorn sqlmodel "python-jose[cryptography]" "passlib[bcrypt]==1.7.4" bcrypt==4.0.1 \
            python-multipart pydantic pydantic-settings "qrcode[pil]" Pillow pytest httpx email-validator
      - name: Run tests (auth + document wallet + grievances)
        run: pytest tests/test_auth.py tests/test_documents.py tests/test_grievances.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsc -b
      - run: npm run build

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsc --noEmit
