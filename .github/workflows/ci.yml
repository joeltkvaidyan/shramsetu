name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit + security tests (vitest + mongodb-memory-server)
        run: npm test

  ai-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - name: Install minimal test dependencies
        # Only what the offline tests import: fastapi (main.py), pydantic-settings
        # (config), pytest, httpx (starlette TestClient) and python-multipart.
        # The heavy ML stack is NOT needed for tests -- test_warmup.py imports
        # main and the routes work with every ML import blocked (verified: the
        # service modules keep their heavy imports inside function bodies, not
        # at module level).
        #
        # python-multipart is an IMPORT-TIME requirement of main.py, not a test
        # nicety: main.py:252 declares `file: UploadFile = File(...)`, and
        # FastAPI raises "Form data requires python-multipart to be installed"
        # while building the app, so test_warmup.py fails to COLLECT (exit 2)
        # on a clean install. It is pinned in requirements-dev.txt.
        run: pip install fastapi==0.115.0 pydantic-settings==2.5.2 -r requirements-dev.txt
      - name: Run test suite (offline; no model downloads)
        run: python -m pytest
      - name: Compile check (syntax errors fail the build)
        run: python -m compileall app rag main.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (covers src/**/*.test.tsx too)
        run: npx tsc -b
      - name: Unit + component tests (vitest + jsdom)
        run: npm test
      - name: Build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit — server (fails on high+)
        working-directory: server
        run: npm audit --audit-level=high
      - name: npm audit — frontend production deps (fails on high+)
        # --omit=dev is deliberate and load-bearing. The frontend has two known
        # advisory groups, neither of them in shipped code:
        #   1. HIGH   braces (stack-exhaustion DoS) reached through tailwindcss@3
        #            -> chokidar -> braces, and also via fast-glob -> micromatch.
        #            Build-time glob expansion only; devDependency. Verified
        #            2026-10-03: tailwindcss 3.4.19 is the LAST 3.x release and
        #            the advisory range is <=3.4.19, so no 3.x patch exists.
        #            npm audit fix --force wants tailwindcss@4, a breaking major.
        #   2. MODERATE react-router-dom open redirect / SSR hydration. Verified
        #            2026-10-03: the advisory range is 6.0.0 - 7.17.0 and the
        #            last 6.x release is 6.30.6, so again no in-major patch.
        #            npm audit fix --force wants react-router-dom@7 (breaking;
        #            the app uses only stable v6 APIs and would likely survive
        #            it, but the fix belongs in its own commit, not a CI tweak).
        # Both are devDependency/prod-moderate, so this gate is "no high or
        # critical in what we actually ship". Tracked in docs/SECURITY.md.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Document dev-only frontend advisories (does not fail the build)
        working-directory: frontend
        run: npm audit --audit-level=high || true
