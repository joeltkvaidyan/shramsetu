name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit + security tests (vitest + mongodb-memory-server)
        run: npm test

  ai-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - name: Install minimal test dependencies
        # Only what the offline tests import: fastapi (main.py), pydantic-settings
        # (config), pytest. The heavy ML stack is NOT needed for tests.
        run: pip install fastapi==0.115.0 pydantic-settings==2.5.2 -r requirements-dev.txt
      - name: Run test suite (offline; no model downloads)
        run: python -m pytest
      - name: Compile check (syntax errors fail the build)
        run: python -m compileall app rag main.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit — server (fails on high+)
        working-directory: server
        run: npm audit --audit-level=high
      - name: npm audit — frontend (fails on high+)
        working-directory: frontend
        run: npm audit --audit-level=high
