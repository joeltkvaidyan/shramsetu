# ShramSetu frontend — production nginx.
#
# - Serves the pre-built SPA from /usr/share/nginx/html (Vite build output).
# - Proxies /api and /api/* to the Node.js backend (compose service name
#   "server" on the docker network; port 8000).
# - No CORS headers needed (same origin).
# - Optional HTTPS via a reverse proxy in front (e.g. nginx-proxy + acme-companion)
#   or with the certbot docker images.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: everything not a static file goes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — point at the Node backend.
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Keep long-lived websocket/health connections alive.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # No /api/*.js, *.css, *.ico, favicon.ico etc. — nginx serves them.

    # Security: hide nginx version.
    server_tokens off;
}
